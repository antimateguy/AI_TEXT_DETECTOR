<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI vs Human Text Detector</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
      color: #222;
    }
    header {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }
    header h1 {
      color: #2a4d8f;
      margin-bottom: 0.2rem;
    }
    header p {
      color: #555;
    }
    .container {
      max-width: 700px;
      margin: 1rem auto;
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.08);
    }
    textarea {
      width: 100%;
      height: 180px;
      font-size: 15px;
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      resize: vertical;
    }
    button {
      margin-top: 1rem;
      padding: 0.8rem 1.8rem;
      border: none;
      background-color: #2a4d8f;
      color: #fff;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.25s;
    }
    button:hover {
      background-color: #1f3770;
    }
    .result {
      margin-top: 1.5rem;
      text-align: center;
    }
    .result h2 {
      margin-bottom: 0.5rem;
    }
    .highlight {
      font-weight: 600;
      border-radius: 4px;
      padding: 0 3px;
    }
    .ai { background-color: #ffe0e0; color: #b50000; }
    .human { background-color: #e0ffe3; color: #007a2b; }
  </style>
</head>
<body>
  <header>
    <h1>AI vs Human Text Detector</h1>
    <p>Analyze any essay, article, or paragraph to check if it’s human-written or AI-generated.</p>
  </header>

  <div class="container">
    <textarea id="inputText" placeholder="Paste your text here..."></textarea>
    <button onclick="predictText()">Predict</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    async function predictText() {
      const text = document.getElementById("inputText").value.trim();
      const resultDiv = document.getElementById("result");
      if (!text) {
        resultDiv.innerHTML = "<p style='color:red;'>Please enter some text!</p>";
        return;
      }
      resultDiv.innerHTML = "<p>⏳ Analyzing...</p>";
      const response = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      const data = await response.json();
      const label = data.label === "AI" ? "🤖 AI-generated" : "🧠 Human-written";
      const conf = (data.confidence * 100).toFixed(2);
      let highlighted = data.highlighted_text || text;

      resultDiv.innerHTML = `
        <h2>${label}</h2>
        <p>Confidence: <b>${conf}%</b></p>
        <hr>
        <p style="text-align:left">${highlighted}</p>
      `;
    }
  </script>
</body>
</html>
